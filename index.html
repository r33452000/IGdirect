<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IG 授權完成</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh;
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
    background: #f5f3ff; color: #1f2937;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card {
    background: #fff; border-radius: 20px; padding: 28px 22px;
    max-width: 440px; width: 100%; box-shadow: 0 10px 40px rgba(99,62,180,.12);
  }
  .icon { font-size: 44px; text-align: center; margin-bottom: 8px; }
  h1 { font-size: 20px; text-align: center; margin: 0 0 6px; }
  p.sub { text-align: center; color: #6b7280; margin: 0 0 20px; font-size: 15px; line-height: 1.6; }
  .label { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
  .code {
    background: #f3f0ff; border: 1px solid #ddd6fe; border-radius: 12px;
    padding: 14px; font-family: ui-monospace, Menlo, monospace; font-size: 14px;
    word-break: break-all; line-height: 1.5; color: #4c1d95; max-height: 160px; overflow-y: auto;
  }
  button {
    width: 100%; margin-top: 14px; padding: 15px; border: none; border-radius: 12px;
    background: #7c3aed; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  button:active { background: #6d28d9; }
  .steps { margin-top: 20px; padding-top: 18px; border-top: 1px solid #f0edfa; font-size: 14px; color: #4b5563; line-height: 1.7; }
  .steps b { color: #1f2937; }
  .err { color: #b91c1c; }
  .hide { display: none; }
</style>
</head>
<body>
<div class="card">
  <div id="ok" class="hide">
    <div class="icon">✅</div>
    <h1>授權成功！</h1>
    <p class="sub">請複製下面這組代碼，用 LINE 傳回給 Emily。</p>
    <div class="label">你的授權代碼</div>
    <div class="code" id="codeBox"></div>
    <button id="copyBtn">複製代碼</button>
    <div class="steps">
      <b>接下來：</b><br>
      1. 按上面「複製代碼」<br>
      2. 回到 LINE，貼給 Emily<br>
      3. 完成，這個頁面可以關掉了
    </div>
  </div>

  <div id="deny" class="hide">
    <div class="icon">⚠️</div>
    <h1>尚未完成授權</h1>
    <p class="sub err" id="errMsg">授權被取消或未完成。</p>
    <p class="sub">請回到 Emily 給你的連結，重新點一次並按「同意」。</p>
  </div>

  <div id="empty" class="hide">
    <div class="icon">🔗</div>
    <h1>請從授權連結進入</h1>
    <p class="sub">這個頁面需要從 Emily 提供的 Instagram 授權連結開啟。</p>
  </div>
</div>

<script>
(function () {
  function getParam(name) {
    var s = window.location.search || "";
    var h = window.location.hash ? window.location.hash.replace(/^#/, "?") : "";
    var m = new URLSearchParams(s).get(name);
    if (m) return m;
    try { return new URLSearchParams(h).get(name); } catch (e) { return null; }
  }
  var code = getParam("code");
  var error = getParam("error") || getParam("error_reason") || getParam("error_description");

  var ok = document.getElementById("ok");
  var deny = document.getElementById("deny");
  var empty = document.getElementById("empty");

  if (code) {
    code = code.replace(/#_$/, "");
    document.getElementById("codeBox").textContent = code;
    ok.classList.remove("hide");
    var btn = document.getElementById("copyBtn");
    btn.addEventListener("click", function () {
      navigator.clipboard.writeText(code).then(function () {
        btn.textContent = "已複製 ✓";
        setTimeout(function () { btn.textContent = "複製代碼"; }, 1800);
      }).catch(function () {
        var r = document.createRange();
        r.selectNodeContents(document.getElementById("codeBox"));
        var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
        btn.textContent = "已選取，請長按複製";
      });
    });
  } else if (error) {
    document.getElementById("errMsg").textContent = decodeURIComponent(error);
    deny.classList.remove("hide");
  } else {
    empty.classList.remove("hide");
  }
})();
</script>
</body>
</html>
